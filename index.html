function getMetrics(){
 const shortage=Math.max(0,Number(state.shortage)||0),stock=Math.max(0,Number(state.stock)||0),delay=Math.max(0,Number(state.delay)||0);
 const net=Math.max(0,shortage-stock),baseCost=Math.max(0,Number(state.baseCost)||0),premium=Math.max(0,Number(state.altPremium)||0),orders=Math.max(0,Number(state.orders)||0),orderValue=Math.max(0,Number(state.orderValue)||0),margin=Math.min(100,Math.max(0,Number(state.margin)||0));
 const uncovered=Math.max(0,shortage-stock);
 const noActionDelay=delay+(uncovered>0?Math.ceil(uncovered/250):0);
 const altCost=net*(baseCost+premium);
 const delayExposure=orders*orderValue*(margin/100)*Math.min(1,noActionDelay/20);
 const options={
 wait:{label:'Wait for original supplier',materialCost:net*baseCost,delayDays:noActionDelay,lateOrders:Math.min(orders,Math.ceil(noActionDelay/3)),risk:'High',riskScore:82,benefit:'Avoids purchase-price premium; preserves current supplier relationship.',tradeoff:'Highest schedule and customer-delivery exposure.'},
 alternative:{label:'Buy from alternative supplier',materialCost:net*(baseCost+premium),delayDays:Math.max(0,Math.min(2,Math.ceil(net/500))),lateOrders:Math.min(orders,Math.ceil(Math.max(0,Math.min(2,Math.ceil(net/500)))/3)),risk:'Medium',riskScore:44,benefit:'Reduces schedule disruption if the supplier is approved and delivers as promised.',tradeoff:'Higher unit cost and supplier qualification / incoming quality checks.'},
 prioritize:{label:'Prioritize stock for critical orders',materialCost:stock*baseCost,delayDays:Math.max(1,Math.ceil(net/350)),lateOrders:Math.min(orders,Math.ceil(Math.max(1,Math.ceil(net/350))/3)),risk:'Medium–High',riskScore:62,benefit:'Protects selected priority orders while buying time for replenishment.',tradeoff:'Other orders may be delayed; allocation must be agreed with sales.'}
 };
 Object.keys(options).forEach(k=>{let o=options[k];o.totalCost=o.materialCost+(o.delayDays/Math.max(1,delay))*delayExposure;o.exposure=orders*orderValue*Math.min(1,o.delayDays/20);});
 return {shortage,stock,net,baseCost,premium,orders,orderValue,margin,delay,options,selected:options[state.decision]||options.alternative};
}

${impactLine('Orders exposed',m.selected.lateOrders+' of '+m.orders,Math.min(100,m.selected.lateOrders/Math.max(1,m.orders)*100))}

</div><div class="result-box" style="margin-top:16px"><h3>What must be verified?</h3><p>${esc(state.notes)}</p></div><button class="btn primary" style="width:100%;margin-top:12px" data-view="compare">Compare response options →</button></div></div>`}
function impactLine(name,value,pct){return `<div class="impact-line"><div><div class="name">${esc(name)}</div><div class="bar"><span style="width:${Math.max(0,Math.min(100,pct))}%"></span></div></div><div class="num">${esc(value)}</div></div>`}
function renderCompare(){const m=getMetrics(),keys=['wait','alternative','prioritize'];return `<div class="pagehead"><div><div class="eyebrow">Management choice / consequence comparison</div><h1>Compare Your Choices</h1><p>Compare the available responses side by side. Choose the option you recommend, then record why. The app will not approve or carry out the decision.</p></div><div class="head-actions"><button class="btn" data-view="scenario">Change assumptions</button><button class="btn primary" data-action="recordDecision">Record selected option</button></div></div>
<div class="event-banner"><div><div class="eyebrow" style="color:#8edbe1">SCENARIO</div><h2>${esc(stageForScenario().name)}</h2><p>Net material gap ${number(m.net)} units · ${m.orders} linked customer orders · ${state.site}</p></div><div class="event-badge">SIDE-BY-SIDE</div></div>
<div class="card" style="padding:0;overflow:auto"><table class="compare-table"><thead><tr><th>Consequence measure</th>${keys.map(k=>`<th>${esc(m.options[k].label)}${state.decision===k?' ✓':''}</th>`).join('')}</tr></thead><tbody>
<tr><td>Illustrative material spend</td>${keys.map(k=>`<td><b>${money0(m.options[k].materialCost)}</b></td>`).join('')}</tr>
<tr><td>Estimated schedule delay</td>${keys.map(k=>`<td>${m.options[k].delayDays} days</td>`).join('')}</tr>
<tr><td>Customer orders exposed</td>${keys.map(k=>`<td>${m.options[k].lateOrders} / ${m.orders}</td>`).join('')}</tr>
<tr><td>Risk indicator</td>${keys.map(k=>`<td><span class="tag ${m.options[k].riskScore>70?'red':m.options[k].riskScore>50?'amber':'green'}">${m.options[k].risk} · ${m.options[k].riskScore}/100</span></td>`).join('')}</tr>
<tr><td>Potential benefit</td>${keys.map(k=>`<td style="min-width:200px;text-align:left">${esc(m.options[k].benefit)}</td>`).join('')}</tr>
<tr><td>Trade-off</td>${keys.map(k=>`<td style="min-width:200px;text-align:left">${esc(m.options[k].tradeoff)}</td>`).join('')}</tr>
<tr><td>Action</td>${keys.map(k=>`<td><button class="btn ${state.decision===k?'primary':''} small" data-decision="${k}">${state.decision===k?'Selected':'Select option'}</button></td>`).join('')}</tr>
</tbody></table></div>
<div class="two-col" style="margin-top:16px"><div class="card"><div class="cardhead"><div><h2>Selected response</h2><p>Your selected choice: ${esc(m.selected.label)}</p></div><span class="tag ${m.selected.riskScore>70?'red':m.selected.riskScore>50?'amber':'green'}">${m.selected.risk} risk</span></div><div class="result-grid"><div class="result-tile"><span>Material spend</span><b>${money0(m.selected.materialCost)}</b></div><div class="result-tile"><span>Delay</span><b>${m.selected.delayDays} days</b></div><div class="result-tile"><span>Risk score</span><b>${m.selected.riskScore}/100</b></div></div><div class="result-box" style="margin-top:12px"><h3>Approval conditions</h3><p>Confirm supplier approval and quality status, delivery commitment, purchasing authority and affected customer priorities before execution.</p></div></div>
<div class="card"><div class="cardhead"><div><h2>Decision rationale</h2><p>Capture why this option is preferred.</p></div></div><div class="field"><label for="notes">Assumptions, risks and conditions</label><textarea id="notes" data-field="notes">${esc(state.notes)}</textarea></div><div class="field" style="margin-top:12px"><label for="approval">Decision status</label><select id="approval" data-field="approval"><option ${state.approval==='Under review'?'selected':''}>Under review</option><option ${state.approval==='Recommended'?'selected':''}>Recommended</option><option ${state.approval==='Approved by management'?'selected':''}>Approved by management</option><option ${state.approval==='Rejected'?'selected':''}>Rejected</option></select></div><button class="btn primary" style="width:100%;margin-top:12px" data-action="recordDecision">Save to Decision Register</button></div></div>`}
function renderMasters(){const masterRows=[['Company',state.company,'Legal entity / accounting boundary'],['Business Unit / Plant',state.site,'Operational scope'],['Process Owner',state.owner,'Accountability for the business process'],['Item',state.item,'Critical material or item being simulated'],['Current Supplier',state.supplier,'Supplier in the original plan'],['Alternative Supplier',state.altSupplier,'Potential alternate source; approval must be validated'],['Warehouse',state.warehouse,'Location used to check usable stock'],['BOM',state.bom,'Product structure used for material requirement'],['Production Plan',state.plan,'Demand and production planning reference'],['Work Order',state.workOrder,'Execution record affected by the scenario']];return `<div class="pagehead"><div><div class="eyebrow">Reference context</div><h1>Business Reference Data</h1><p>These are the example company, plant, item, suppliers and production records used in the story. Change them in Try a Business Scenario.</p></div><div class="head-actions"><button class="btn primary" data-view="scenario">Edit scenario & masters →</button></div></div>
<div class="card" style="padding:0;overflow:auto"><table class="compare-table"><thead><tr><th>Master / record</th><th>Current demo value</th><th>Why it matters in the simulation</th></tr></thead><tbody>${masterRows.map(r=>`<tr><td>${esc(r[0])}</td><td style="text-align:left">${esc(r[1])}</td><td style="text-align:left;font-weight:400;min-width:250px">${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>
<div class="three-col" style="margin-top:16px"><div class="result-box"><h3>Check the example details</h3><p>Confirm item, warehouse, supplier and BOM references match actual ERP records before using results.</p></div><div class="result-box"><h3>How the teams connect</h3><p>Link the master references to purchasing, inventory, production, sales and finance records.</p></div><div class="result-box"><h3>Governance</h3><p>Supplier approvals, substitution rules and authority limits remain mandatory controls.</p></div></div>`}
function renderDecisions(){return `<div class="pagehead"><div><div class="eyebrow">Your saved recommendations</div><h1>Decision Record</h1><p>Save the choice you recommend, why you chose it, its estimated impact, and what someone must check before acting in the real business.</p></div><div class="head-actions"><button class="btn" data-action="export">Export CSV</button><button class="btn primary" data-action="recordDecision">Record current decision</button></div></div>
<div class="grid metrics"><div class="metric"><div class="label">Decisions recorded</div><div class="value">${state.decisions.length}</div><div class="sub">This browser session / saved demo</div></div><div class="metric"><div class="label">Current scenario</div><div class="value" style="font-size:18px">${esc(scenarioName())}</div><div class="sub">Active business event</div></div><div class="metric"><div class="label">Selected response</div><div class="value" style="font-size:18px">${esc(getMetrics().selected.label)}</div><div class="sub">Candidate response</div></div><div class="metric"><div class="label">Approval status</div><div class="value" style="font-size:18px">${esc(state.approval)}</div><div class="sub">Must be explicitly reviewed</div></div></div>
<div class="card"><div class="cardhead"><div><h2>Recorded decisions</h2><p>Each entry is a simulation decision record, not an ERP transaction.</p></div></div>${state.decisions.length?`<div class="decision-list">${state.decisions.map((d,i)=>`<div class="decision-item"><span class="bullet"></span><div style="flex:1"><b>${esc(d.scenario)} — ${esc(d.option)}</b><p>${esc(d.company)} · ${esc(d.site)} · ${esc(d.status)} · ${esc(d.time)}</p><p>Spend ${money0(d.cost)} · Delay ${d.delay} days · Risk ${d.risk}/100</p><p>Rationale: ${esc(d.notes)}</p></div><button class="btn small" data-delete="${i}">Remove</button></div>`).join('')}</div>`:`<div class="empty">No decisions recorded yet. Open Impact Comparison, select a response and choose “Record selected option”.</div>`}</div>
<div class="result-box" style="margin-top:16px"><h3>Required before real-world execution</h3><p>Validate source transactions, obtain the correct approval, update the real ERP through authorized users, then return with actual results and evidence. This prototype does not execute business transactions.</p></div>`}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const root=$('#viewRoot');$('#crumbName').textContent=names[state.view]||names.control;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));const renderers={guide:renderGuide,control:renderControl,scenario:renderScenario,flow:renderFlow,compare:renderCompare,masters:renderMasters,decisions:renderDecisions};root.innerHTML=(renderers[state.view]||renderControl)();wire();persist()}
function wire(){
 document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
 document.querySelectorAll('[data-scenario]').forEach(b=>b.addEventListener('click',()=>{state.scenario=b.dataset.scenario;state.stage=0;state.cause=stageForScenario().event;state.theatrePlaying=false;if(theatreTimer)clearInterval(theatreTimer);theatreTimer=null;render()}));
 document.querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',()=>{state.stage=Number(b.dataset.stage);render()}));
 document.querySelectorAll('[data-decision]').forEach(b=>b.addEventListener('click',()=>{state.decision=b.dataset.decision;render();toast('Response option selected.')})); 
 // Keep edits in state immediately. Do not re-render on every field change: that can
 // replace the focused input and lose the value before the user presses Recalculate.
 document.querySelectorAll('[data-field]').forEach(el=>{
   const update=()=>{state[el.dataset.field]=el.value;persist()};
   el.addEventListener('input',update);el.addEventListener('change',update);
 });
 document.querySelectorAll('[data-number]').forEach(el=>{
   const update=()=>{
     state[el.dataset.number]=Math.max(0,Number(el.value)||0);
     const out=$('#'+el.id+'Out');
     if(out)out.textContent=el.id==='delay'?state.delay+' days':el.id==='margin'?state.margin+'%':number(state[el.id]);
     const target=$('.result-box');
     if(target){const m=getMetrics();const p=target.querySelector('p');if(p)p.innerHTML='Net material gap: <b>'+number(m.net)+' units</b>. Selected option spend: <b>'+money0(m.selected.materialCost)+'</b>. Projected delay: <b>'+m.selected.delayDays+' days</b>.'}
     persist();
   };
   el.addEventListener('input',update);el.addEventListener('change',update);
 });
 document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action)));
 document.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>{state.decisions.splice(Number(b.dataset.delete),1);render();toast('Decision removed.')}))
}
function action(a){
 if(a==='play'){
   if(state.theatrePlaying){state.theatrePlaying=false;if(theatreTimer)clearInterval(theatreTimer);theatreTimer=null;render();return}
   state.theatrePlaying=true;render();
   if(theatreTimer)clearInterval(theatreTimer);
   theatreTimer=setInterval(()=>{if(!state.theatrePlaying){clearInterval(theatreTimer);theatreTimer=null;return}const max=stageForScenario().stages.length-1;if(state.stage>=max){state.theatrePlaying=false;clearInterval(theatreTimer);theatreTimer=null;render();toast('Scenario replay complete.');return}state.stage++;render()},1700);
   return
 }
 if(a==='replay'){if(theatreTimer)clearInterval(theatreTimer);theatreTimer=null;state.theatrePlaying=false;state.stage=0;render();toast('Replay reset to Scene 1.');return}
 if(a==='editScenario'){setView('scenario');return}
 if(a==='runSimulation'){
   // Read the actual controls at click-time as a final safeguard against stale state.
   document.querySelectorAll('[data-field]').forEach(el=>{state[el.dataset.field]=el.value});
   document.querySelectorAll('[data-number]').forEach(el=>{state[el.dataset.number]=Math.max(0,Number(el.value)||0)});
   const m=getMetrics();state.stage=0;state.theatrePlaying=false;
   if(theatreTimer)clearInterval(theatreTimer);theatreTimer=null;
   persist();render();toast('Recalculated: material gap '+number(m.net)+' units; selected option '+m.selected.label+'.');return
 }
 if(a==='nextStage'){state.stage=Math.min(stageForScenario().stages.length-1,state.stage+1);render();return}
 if(a==='prevStage'){state.stage=Math.max(0,state.stage-1);render();return}
 if(a==='recordDecision'){const m=getMetrics();state.decisions.unshift({scenario:scenarioName(),option:m.selected.label,company:state.company,site:state.site,status:state.approval,cost:m.selected.materialCost,delay:m.selected.delayDays,risk:m.selected.riskScore,notes:state.notes,time:new Date().toLocaleString()});state.view='decisions';render();toast('Decision added to the register.');return}
 if(a==='resetInputs'){const keep={view:state.view,decisions:state.decisions};state={...initial,...keep};render();toast('Scenario inputs reset.');return}
 if(a==='export'){const rows=[['Scenario','Option','Company','Site','Status','Material Spend','Delay Days','Risk Score','Rationale','Recorded At'],...state.decisions.map(d=>[d.scenario,d.option,d.company,d.site,d.status,d.cost,d.delay,d.risk,d.notes,d.time])];const csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='consequence-theatre-decisions.csv';a.click();URL.revokeObjectURL(url);toast('Decision register exported.');return}
}
$('#resetAll').addEventListener('click',()=>{if(theatreTimer)clearInterval(theatreTimer);theatreTimer=null;state={...initial,view:'control',stage:0,decisions:[],scenarioSaved:false,theatrePlaying:false};try{localStorage.removeItem('consequenceTheatreDemo')}catch(e){}render();toast('Demo reset to original values.')});
loadSaved();state.view='guide';render();
</script>
</body>
